<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>isoBuilder</title>
<link rel="icon" type="image/png" sizes="1024x1024" href="icon.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#5d6673;--line:#e3e6eb;--accent:#e95420;--accent-ink:#fff;--ok:#1f8a4c;--err:#c62828;--warn-bg:#fff4e5;--warn:#8a4b00;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--text:#eef0f3;--muted:#9aa3ae;--line:#2a2f37;--warn-bg:#2b2112;--warn:#f0b35a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
.brand{display:flex;align-items:center;gap:12px}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.step{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.num{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.done .num{background:var(--ok);color:#fff}
.active .num{background:var(--accent);color:#fff}
h2{font-size:16px;margin:0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer;margin-top:8px}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.opt small{color:var(--muted);display:block}
.opt .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:8px 0}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit}
button.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;margin-top:12px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.ok{color:var(--ok)}.err{color:var(--err)}.muted{color:var(--muted)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rb{margin-top:14px;border:1px solid var(--err);border-radius:12px;padding:12px 14px}
.hidden{display:none!important}
.btn.big{font-size:16px;font-weight:700;padding:14px 20px;letter-spacing:.02em}
label.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer}
label.chk input{margin-top:4px}
.big{font-size:40px;line-height:1}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
#sAgent{border-color:var(--accent)}
#sAgent h2{margin:0 0 6px}
#sAgent .who{font-weight:600}
</style>
</head>
<body>
<main>
  <h1 class="brand"><img src="icon.png" alt="" width="40" height="40">isoBuilder</h1>
  <p class="sub" id="subtitle">Grava a ISO do instalador automático do Ubuntu Server no seu pendrive.</p>

  <section class="card hidden" id="sAgent" aria-live="polite"></section>

  <section class="card" id="s1">
    <div class="step"><span class="num">1</span><h2 id="s1title">Escolha a ISO baixada</h2></div>
    <div id="fetch"></div>
    <div id="manual">
      <div id="isos"></div>
      <div class="row"><input type="text" id="isoPath" placeholder="…ou cole o caminho completo do arquivo .iso"><button class="btn" id="useIso">Usar</button></div>
    </div>
    <div id="hash" class="muted" style="margin-top:10px"></div>
  </section>

  <section class="card hidden" id="sLocal" aria-live="polite"></section>

  <section class="card" id="s2">
    <div class="step"><span class="num">2</span><h2>Escolha o pendrive</h2></div>
    <div id="disks"></div>
    <div class="row"><button class="btn" id="refresh">Atualizar lista</button></div>
  </section>

  <section class="card" id="s3">
    <div class="step"><span class="num">3</span><h2>Gravar</h2></div>
    <div id="confirmBox"></div>
    <div id="job"></div>
  </section>

  <footer><span id="foot">Nenhum dado seu é enviado; o gravador só baixa a ISO do servidor de onde veio.</span> <button class="btn" id="quit" style="margin-left:8px">Encerrar</button></footer>
</main>
<script>
const $ = s => document.querySelector(s);
const fmt = n => { const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1000&&i<4){n/=1000;i++} return (i?n.toFixed(1):n)+' '+u[i]; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {}, selDisk = null, selKey = null, confirmed = false;
let VT = {}, vtMode = 'copy', vtFolder = '', vtNew = '';  // Ventoy: info por pendrive e escolhas
let showManual = false;  // Windows: "Já tenho a ISO"
const isWin = () => !!((S.bundle && S.bundle.kind === 'windows') || (S.stick && S.stick.os === 'windows'));
const osName = () => isWin() ? 'o Windows 11' : 'o Ubuntu Server';

async function api(path, body){
  const r = await fetch('api/'+path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ('erro '+r.status));
  return j;
}
function stepClass(id, state){ const el=$(id).querySelector('.step'); el.className='step '+state; }

// Aberto a partir da unidade INSTALAR de um pendrive já gravado: só reiniciar e instalar.
function renderStick(){
  if(document.getElementById('stickBox')){ const re=document.getElementById('rbErr'); if(re && S.reboot_error) re.textContent='✖ '+S.reboot_error; return; }
  const K=S.stick, R=S.reboot||{};
  document.querySelector('main').innerHTML = `<h1 class="brand"><img src="icon.png" alt="" width="40" height="40">isoBuilder</h1>
  <p class="sub">${isWin() ? 'Pendrive de instalação do Windows 11 — computador' : 'Pendrive de instalação do Ubuntu Server — servidor'} <b>${esc(K.hostname)}</b></p>
  <section class="card" id="stickBox">
    ${R.available ? `<div class="warn"><b>⚠ Este computador será FORMATADO.</b> Ao reiniciar, o instalador apaga ${isWin() ? 'o maior disco interno' : 'todo o disco interno'} e instala ${osName()}:
      arquivos, programas e o sistema atual (Windows/macOS) serão perdidos, sem volta. Salve o que precisar antes. Deixe o pendrive conectado.</div>
      <p class="small" style="margin:12px 0 4px"><b>O que acontece:</b> ${esc(R.how)} ${esc(R.note)} A instalação é automática: não é preciso responder nada.${K.ventoy ? ` <b>Este pendrive usa o Ventoy:</b> no menu dele, escolha <b>${esc(K.iso_name)}</b>.` : ''}</p>
      <label class="chk"><span>Para confirmar, digite <b>FORMATAR</b>:</span></label>
      <input id="rbTxt" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="FORMATAR" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit">
      <div class="row"><button class="btn danger" id="rbGo" disabled>Reiniciar agora e formatar este computador</button></div>
      <div class="err" id="rbErr"></div>`
    : `<div class="warn">${esc(R.note || 'Reinício automático indisponível neste sistema.')}</div>
      <p class="small">Outra forma: desligue, ligue de novo apertando a tecla do menu de boot (F12, F11, F8 ou Esc) e escolha o pendrive.</p>`}
  </section>
  <footer><button class="btn" id="quit">Encerrar</button></footer>`;
  wireReboot('stickBox');
  document.getElementById('quit').onclick = async () => { try{ await api('quit',{}); document.body.innerHTML='<main><h1>isoBuilder fechado.</h1></main>'; }catch(e){ alert(e.message); } };
}
function wireReboot(boxId){
  const rt=document.getElementById('rbTxt'), rg=document.getElementById('rbGo');
  if(!rt || !rg) return;
  rt.oninput = () => { rg.disabled = rt.value.trim().toUpperCase() !== 'FORMATAR'; };
  rg.onclick = async () => {
    if(!confirm('Último aviso: reiniciar AGORA e APAGAR o disco deste computador para instalar '+osName()+'?')) return;
    rg.disabled = true;
    try{
      const r = await api('reboot',{confirm: rt.value.trim().toUpperCase()});
      document.getElementById(boxId).innerHTML = `<div class="ok" style="font-size:18px">↻ Reiniciando…</div><p>${esc(S.reboot.how)} ${esc(S.reboot.note)}</p>${r.dry_run?'<p class="muted small">(modo de teste: nada foi reiniciado)</p>':''}`;
    }catch(e){ document.getElementById('rbErr').textContent='✖ '+e.message; rg.disabled=false; }
  };
}

// Acesso remoto do técnico: só com a permissão explícita da pessoa (caixa marcada).
function renderAgent(){
  const box = $('#sAgent'), A = S.agent;
  if (!A) { box.classList.add('hidden'); return; }
  const sig = A.state + '|' + A.message;
  if (box.dataset.sig === sig) return;          // não redesenha: a caixa marcada não se perde
  box.dataset.sig = sig; box.classList.remove('hidden');
  if (A.state === 'ok') {
    box.innerHTML = `<h2>✔ Acesso remoto instalado</h2><p class="muted">O técnico já consegue acessar este computador para preparar a formatação${A.message ? ' (' + esc(A.message) + ')' : ''}. Siga abaixo para gravar o pendrive.</p>`;
    return;
  }
  if (A.state === 'instalando') {
    box.innerHTML = `<h2>Instalando o acesso remoto…</h2><p class="muted">Baixando e instalando o agente do sistema deste computador. Leva menos de um minuto.</p>`;
    return;
  }
  if (A.state === 'recusado') {
    box.innerHTML = `<h2>Acesso remoto não instalado</h2><p class="muted">Tudo bem: o resto do isoBuilder funciona normalmente.</p><div class="row"><button class="btn" id="agAgain">Mudei de ideia: permitir</button></div>`;
    $('#agAgain').onclick = () => { box.dataset.sig = ''; S.agent.state = ''; renderAgent(); };
    return;
  }
  box.innerHTML = `<h2>Acesso remoto do técnico</h2>
    <p>O técnico que preparou esta instalação pediu acesso remoto a este computador para preparar a formatação. Com a sua permissão, o isoBuilder instala o agente do Remoto, que deixa o técnico ver a tela, usar o terminal e transferir arquivos deste computador.</p>
    <p class="muted">Você pode remover depois, nos programas instalados (“Mesh Agent”).</p>
    ${A.state === 'erro' ? `<div class="err">✖ ${esc(A.message)}</div>` : ''}
    <label class="chk"><input type="checkbox" id="agOk"> <span>Permito o acesso remoto a este computador.</span></label>
    <div class="row"><button class="btn primary" id="agYes" disabled>${A.state === 'erro' ? 'Tentar de novo' : 'Permitir e instalar'}</button><button class="btn" id="agNo">Agora não</button></div>`;
  $('#agOk').onchange = e => { $('#agYes').disabled = !e.target.checked; };
  $('#agYes').onclick = async () => { if (!$('#agOk').checked) return; try { await api('agent', {action:'install'}); } catch (e) { alert(e.message); } poll(); };
  $('#agNo').onclick = async () => { try { await api('agent', {action:'decline'}); } catch (e) { } poll(); };
}

// "Formatar este computador (sem pendrive)": aparece no gravador personalizado.
function renderLocal(){
  const box=document.getElementById('sLocal');
  const li=S.local_install||{}, P=S.install;
  if(!li.kind){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const title = li.kind==='windows' ? 'Formatar este computador (Windows, sem pendrive)' : 'Formatar este computador (sem pendrive)';
  const head = `<div class="step"><span class="num">!</span><h2>${title}</h2></div>`;
  if(P){
    let body;
    if(P.phase==='error') body=`<div class="err">✖ ${esc(P.message)}</div><div class="row"><button class="btn" id="liAgain">Tentar de novo</button></div>`;
    else if(P.phase==='done'||P.phase==='rebooting') body=`<div class="ok" style="font-size:18px">↻ ${esc(P.message||'Reiniciando…')}</div><p class="muted small">Não desligue: o instalador começa sozinho e o computador volta a aparecer no painel quando terminar.</p>`;
    else body=`<div>${esc(P.message||'Preparando…')}</div><p class="muted small">Não desligue.</p>`;
    box.innerHTML=head+`<div id="liBox">${body}</div>`;
    const ag=document.getElementById('liAgain'); if(ag) ag.onclick=async()=>{ try{ await api('reset',{}); }catch(e){} poll(); };
    return;
  }
  if(!li.available){ box.innerHTML=head+`<p class="muted">${esc(li.reason||'indisponível')}</p>`; return; }
  if(document.getElementById('liGo')) return; // já desenhado: não apaga o que foi digitado
  box.innerHTML=head+`
    <p class="muted">Instala ${li.kind==='windows'?'o Windows':'o Ubuntu'} <b>neste computador</b>, sem pendrive: o instalador é carregado na memória e o disco é apagado. Funciona em UEFI e em BIOS antiga. Precisa de cerca de ${li.need_ram_gb} GB de memória (RAM).</p>
    <div class="err" style="border:0;padding:0;margin:0 0 10px"><b>Isto apaga TODO o disco deste computador</b> — arquivos, programas e o sistema atual —, sem volta.</div>
    ${li.kind==='windows'?`<label class="chk" style="margin:6px 0"><input type="checkbox" id="liDry" checked> <span><b>Testar sem apagar</b> (recomendado na 1ª vez): o PC reinicia no instalador, confere o disco, escreve um relatório e volta ao Windows — sem apagar nada.</span></label>`:''}
    <label class="chk"><span>Para confirmar, digite <b>FORMATAR</b>:</span></label>
    <input id="liTxt" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="FORMATAR" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit">
    <div class="row"><button class="btn danger" id="liGo" disabled>Formatar este computador agora</button></div>
    <div class="err" id="liErr"></div>`;
  const t=document.getElementById('liTxt'), g=document.getElementById('liGo');
  const updateBtn=()=>{ const dry=document.getElementById('liDry'); g.textContent = (dry&&dry.checked)?'Testar sem apagar agora':'Formatar este computador agora'; };
  t.oninput=()=>{ g.disabled = t.value.trim().toUpperCase()!=='FORMATAR'; };
  { const dry=document.getElementById('liDry'); if(dry){ dry.onchange=updateBtn; updateBtn(); } }
  g.onclick=async()=>{
    g.disabled=true;
    const dry=document.getElementById('liDry');
    try{ await api('install',{confirm:t.value.trim().toUpperCase(), dry_run: !!(dry&&dry.checked)}); poll(); }
    catch(e){ document.getElementById('liErr').textContent='✖ '+e.message; g.disabled=false; }
  };
}

function render(){
  if(S.stick) return renderStick();
  renderAgent();
  // 1. ISO — gravador personalizado: baixa a ISO sozinho
  const B = S.bundle, F = S.fetch;
  if (B && B.kind === 'windows') {
    renderWinFetch(B, F);
  } else if (B) {
    $('#s1title').textContent = 'ISO do servidor “' + B.hostname + '”';
    let f = '';
    if (!F || F.phase === 'downloading' || F.phase === 'hashing') {
      const pct = F ? F.percent : 0;
      const label = F && F.phase === 'hashing' ? 'Conferindo a ISO (SHA256)…' : 'Baixando ' + esc(B.iso_name) + ' (' + fmt(B.size) + ')…';
      const eta = F && F.speed > 0 ? ' · ' + fmt(F.speed) + '/s · ~' + Math.ceil(Math.max(0, (F.total - F.done) / F.speed) / 60) + ' min' : '';
      f = `<div>${label}</div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><small class="muted">${pct.toFixed(0)}%${eta}${F && F.message && F.phase==='downloading' && !F.message.startsWith('Baixando') ? ' · ' + esc(F.message) : ''}. Pode deixar esta janela aberta; o download continua se a internet cair.</small>`;
    } else if (F.phase === 'error') {
      f = `<div class="err">✖ ${esc(F.message)}</div><div class="row"><button class="btn" id="retry">Tentar de novo</button></div>`;
    }
    $('#fetch').innerHTML = f;
    const rb = document.getElementById('retry'); if (rb) rb.onclick = async () => { try { await api('fetch', {}); } catch (e) { alert(e.message); } poll(); };
    $('#manual').style.display = 'none';
  }
  const isos = S.isos || [];
  $('#isos').innerHTML = isos.length ? isos.map(i=>`
    <button class="opt ${S.iso===i.path?'sel':''}" data-iso="${esc(i.path)}">
      <span class="big">💿</span><span class="grow"><b>${esc(i.name)}</b><small>${fmt(i.size)} · ${esc(i.modified)} · ${esc(i.path)}</small></span>
    </button>`).join('') : '<div class="empty">Nenhuma ISO encontrada em Downloads/Área de Trabalho. Baixe a ISO no site ou cole o caminho abaixo.</div>';
  document.querySelectorAll('[data-iso]').forEach(b=>b.onclick=()=>selectIso(b.dataset.iso));
  const hs = S.hash_status;
  let h = '';
  const fetching = B && B.kind !== 'windows' && (!F || F.phase !== 'done');  // enquanto baixa, o status aparece acima
  if(!fetching && S.iso && hs){
    if(hs.phase==='hashing') h = `Conferindo a ISO… ${hs.percent.toFixed(0)}%`;
    else if(hs.phase==='checking') h = esc(hs.message);
    else if(hs.phase==='done') h = `<span class="ok">✔ ${esc(hs.message)}</span><br><small>SHA256 ${esc(hs.sha256)}</small>`;
    else if(hs.phase==='error') h = `<span class="err">✖ ${esc(hs.message)}</span>`;
  }
  $('#hash').innerHTML = h;
  const isoOk = !!S.iso_sha256;
  stepClass('#s1', isoOk?'done':'active');

  renderLocal();

  // 2. Discos
  const disks = S.disks || [];
  // o sistema pode renomear o pendrive (ex.: disk4 -> disk5): reencontra pelo modelo/série/tamanho
  if(selDisk && !disks.find(d=>d.id===selDisk && d.key===selKey)) {
    const same = disks.filter(d=>d.key===selKey);
    if(same.length===1) selDisk = same[0].id; else { selDisk=null; selKey=null; confirmed=false; }
  }
  $('#disks').innerHTML = (S.disk_error?`<div class="err">${esc(S.disk_error)}</div>`:'') + (disks.length ? disks.map(d=>`
    <button class="opt ${selDisk===d.id?'sel':''}" data-disk="${esc(d.id)}">
      <span class="big">🔌</span><span class="grow"><b>${esc(d.name||'Pendrive')}</b><small>${fmt(d.size)} · ${esc(d.bus)}${d.serial?' · '+esc(d.serial):''}</small></span>
    </button>`).join('') : '<div class="empty">Nenhum pendrive encontrado. Conecte o pendrive e clique em “Atualizar lista”. Discos internos nunca aparecem aqui.</div>');
  document.querySelectorAll('[data-disk]').forEach(b=>b.onclick=()=>{ if(S.busy) return; selDisk=b.dataset.disk; selKey=(disks.find(d=>d.id===selDisk)||{}).key||null; confirmed=false; vtMode='copy'; checkVentoy(selDisk, selKey); render(); });
  stepClass('#s2', selDisk?'done':(isoOk?'active':''));

  // 3. Gravar
  const job = S.job;
  const d = disks.find(x=>x.id===selDisk);
  if(S.busy || (job && job.phase!=='idle')){
    $('#confirmBox').innerHTML='';
    const phases={preparing:'Preparando',writing:'Gravando',verifying:'Verificando',tools:'Finalizando',done:'Concluído',error:'Erro'};
    let html = `<b>${phases[job.phase]||''}</b> — ${esc(job.message)}`;
    if(['writing','verifying'].includes(job.phase)){
      const eta = job.speed>0 ? Math.max(0,(job.total-job.done)/job.speed) : 0;
      html += `<div class="bar"><i style="width:${job.percent.toFixed(1)}%"></i></div><small class="muted">${job.percent.toFixed(0)}% · ${fmt(job.speed)}/s · ~${Math.ceil(eta/60)} min restantes. Pode fechar esta aba: a gravação continua; para acompanhar, abra o isoBuilder de novo.</small>`;
    }
    if(job.phase==='done'){
      // já desenhado: não redesenha a cada atualização (apagaria o que foi digitado)
      if(document.getElementById('doneBox')){ const re=document.getElementById('rbErr'); if(re && S.reboot_error) re.textContent='✖ '+S.reboot_error; stepClass('#s3','done'); return; }
      const R = S.reboot || {};
      html = `<div id="doneBox"><div class="ok" style="font-size:18px">✔ ${esc(job.message)}</div>
        <p class="muted">${isWin() ? 'Próximo passo: conecte o pendrive no computador, ligue e escolha o boot pelo pendrive (F12, F11, F8 ou Esc). O pendrive funciona em UEFI e em BIOS antiga (Legacy/CSM); se aparecerem duas opções do pendrive, prefira a <b>UEFI</b>. A instalação do Windows 11 é automática e <b>apaga o maior disco interno</b> do computador.</p><p class="muted small" style="margin:6px 0 0">Em PCs sem UEFI (só BIOS antiga) o Windows 11 instala e funciona, mas a Microsoft não o suporta oficialmente nesses computadores.' : 'Próximo passo: conecte o pendrive no servidor, ligue e escolha o boot pelo pendrive (F12, F11, F8 ou Esc). A instalação é automática.'}</p>
        <div class="row"><button class="btn danger big" id="fmtOpen" type="button">FORMATAR ESTA MÁQUINA</button></div>
        <p class="muted small" style="margin:6px 0 0">Para instalar ${isWin() ? 'o Windows 11' : 'o servidor'} <b>neste</b> computador: ele reinicia pelo pendrive e o disco é apagado.</p>
        <div class="rb hidden" id="fmtBox">
        ${R.available ? `<div class="warn" style="margin-top:12px"><b>⚠ O disco deste computador será APAGADO.</b> Depois de reiniciar, o instalador formata ${isWin() ? 'o maior disco interno' : 'o disco interno'} e instala ${osName()}:
          todos os arquivos, programas e o sistema atual (Windows/macOS) serão perdidos, sem volta. Salve o que precisar antes.</div>
          <p class="small" style="margin:10px 0 4px"><b>O que acontece:</b> ${esc(R.how)} ${esc(R.note)}</p>
          <label class="chk"><span>Para confirmar, digite <b>FORMATAR</b>:</span></label>
          <input id="rbTxt" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="FORMATAR" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit">
          <div class="row"><button class="btn danger" id="rbGo" disabled>Reiniciar agora e formatar este computador</button></div>
          <div class="err" id="rbErr"></div>`
        : `<p class="muted small" style="margin-top:10px">${esc(R.note || 'Reinício automático indisponível neste sistema.')}</p>`}</div></div>`;
    }
    if(job.phase==='error') html = `<div class="err">✖ ${esc(job.message)}</div><div class="row"><button class="btn" id="again">Tentar de novo</button></div>`;
    $('#job').innerHTML = html;
    wireReboot('doneBox');
    const fo=document.getElementById('fmtOpen'); if(fo) fo.onclick=()=>{ document.getElementById('fmtBox').classList.remove('hidden'); fo.closest('.row').style.display='none'; const t=document.getElementById('rbTxt'); if(t) t.focus(); };
    const ag = document.getElementById('again');
    if(ag) ag.onclick = async () => {  // limpa o erro e mantém a ISO e o pendrive escolhidos
      ag.disabled = true; confirmed = false;
      try { await api('reset', {}); } catch(e){ alert(e.message); }
      poll();
    };
    stepClass('#s3', job.phase==='done'?'done':'active');
    return;
  }
  $('#job').innerHTML='';
  if(!isoOk || !d){ $('#confirmBox').innerHTML='<div class="muted">Escolha a ISO e o pendrive acima.</div>'; stepClass('#s3',''); return; }
  stepClass('#s3','active');
  const iso = (S.isos||[]).find(i=>i.path===S.iso);
  const small = isWin() ? (S.win && S.win.min_size > d.size) : (iso && iso.size > d.size);
  const V = VT[selDisk];
  const sig = [selDisk, confirmed, small, vtMode, V===undefined?'?':(V?'v':'-')].join('|');
  if($('#confirmBox').dataset.sig === sig) return;  // não redesenha (preserva o que foi digitado)
  $('#confirmBox').dataset.sig = sig;
  if(V===undefined){ $('#confirmBox').innerHTML='<div class="muted">Verificando o pendrive…</div>'; checkVentoy(selDisk, selKey); return; }
  if(V && vtMode==='copy'){
    const opts = ['<option value="">(raiz do pendrive)</option>'].concat((V.folders||[]).map(f=>`<option ${f===vtFolder?'selected':''}>${esc(f)}</option>`)).concat(['<option value="__new">Nova pasta…</option>']).join('');
    $('#confirmBox').innerHTML = `
      <div class="ok" style="margin-bottom:8px">✔ <b>Ventoy detectado</b> neste pendrive (${fmt(V.free)} livres).</div>
      <div class="radio"><label class="chk"><input type="radio" name="vtm" value="copy" checked> <span><b>Copiar a ISO para o Ventoy</b> — mantém as outras ISOs e arquivos. No boot, escolha esta ISO no menu do Ventoy.</span></label>
      <label class="chk"><input type="radio" name="vtm" value="erase"> <span>Apagar tudo (inclusive o Ventoy) e gravar só esta ISO.</span></label></div>
      <label class="chk" style="display:block"><span>Pasta de destino no pendrive:</span></label>
      <select id="vtSel" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit">${opts}</select>
      <input id="vtNew" placeholder="Nome da nova pasta (ex.: ISOs)" value="${esc(vtNew)}" style="display:${vtFolder==='__new'?'block':'none'};margin-top:8px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit">
      <div class="row"><button class="btn primary" id="vtGo">Copiar para o Ventoy</button></div>`;
    $('#vtSel').value = vtFolder;
    $('#vtSel').onchange = e => { vtFolder = e.target.value; $('#vtNew').style.display = vtFolder==='__new'?'block':'none'; };
    $('#vtNew').oninput = e => { vtNew = e.target.value; };
    document.querySelectorAll('input[name=vtm]').forEach(x=>x.onchange=()=>{ vtMode=x.value; confirmed=false; render(); });
    $('#vtGo').onclick = async () => {
      const folder = vtFolder==='__new' ? vtNew.trim() : vtFolder;
      if(vtFolder==='__new' && !folder) return alert('Digite o nome da nova pasta.');
      $('#vtGo').disabled = true;
      try { await api('ventoy/copy', {disk: selDisk, key: selKey, folder}); } catch(e){ alert(e.message); $('#vtGo').disabled=false; }
      poll();
    };
    return;
  }
  $('#confirmBox').innerHTML = (V ? `<div class="radio" style="margin-bottom:10px"><label class="chk"><input type="radio" name="vtm" value="copy"> <span><b>Copiar a ISO para o Ventoy</b> (mantém o que está no pendrive)</span></label>
      <label class="chk"><input type="radio" name="vtm" value="erase" checked> <span>Apagar tudo (inclusive o Ventoy) e gravar só esta ISO.</span></label></div>` : '') + `
    <div class="warn"><b>Todo o conteúdo de “${esc(d.name||'Pendrive')}” (${fmt(d.size)}) será apagado.</b></div>
    ${small?`<div class="err" style="margin-top:10px">Este pendrive é pequeno demais. Use um de ${isWin()?'16':'8'} GB ou mais.</div>`:''}
    <label class="chk"><input type="checkbox" id="ck" ${confirmed?'checked':''}> <span>Entendo que os arquivos deste pendrive serão perdidos.</span></label>
    <div class="row"><button class="btn primary" id="go" ${(!confirmed||small)?'disabled':''}>Gravar pendrive</button></div>`;
  document.querySelectorAll('input[name=vtm]').forEach(x=>x.onchange=()=>{ vtMode=x.value; confirmed=false; render(); });
  $('#ck').onchange = e => { confirmed = e.target.checked; render(); };
  $('#go').onclick = async () => {
    $('#go').disabled = true;
    try { await api('write', {disk: selDisk, key: selKey, confirm: true}); } catch(e){ alert(e.message); }
    poll();
  };
}

// Windows: configuração do painel + ISO direto da Microsoft (ou "Já tenho a ISO")
function renderWinFetch(B, F){
  const W = B.windows || {};
  $('#s1title').textContent = 'Windows 11 ' + (W.edition||'Pro') + ' para “' + B.hostname + '”';
  $('#subtitle').textContent = 'Grava o pendrive de instalação automática do Windows 11 ' + (W.edition||'Pro') + '. O Windows vem direto do site da Microsoft.';
  $('#foot').textContent = 'Nenhum dado seu é enviado; o gravador só baixa a configuração do painel e o Windows do site da Microsoft.';
  const ph = F ? F.phase : 'config';
  const lang = W.lang ? ' (' + esc(W.lang) + ', ' + esc(W.arch||'x64') + ')' : '';
  let f = '';
  if (S.win && S.win.config_error) {
    f = `<div class="err">✖ ${esc(S.win.config_error)}</div><div class="row"><button class="btn" id="retry">Tentar de novo</button></div>`;
  } else if (ph === 'config') {
    f = '<div>Baixando a configuração do painel…</div>';
  } else if (ph === 'connecting') {
    f = `<div>${esc(F.message)}</div><small class="muted">Windows 11${lang}, direto da Microsoft.</small>`;
  } else if (ph === 'downloading' || ph === 'hashing') {
    const pct = F.percent || 0;
    const label = ph === 'hashing' ? 'Conferindo o Windows baixado (SHA256)…' : 'Baixando o Windows 11 da Microsoft' + lang + ' — ' + fmt(F.total) + '…';
    const eta = F.speed > 0 ? ' · ' + fmt(F.speed) + '/s · ~' + Math.ceil(Math.max(0, (F.total - F.done) / F.speed) / 60) + ' min' : '';
    const note = ph === 'downloading' && F.message && !F.message.startsWith('Baixando') ? ' · ' + esc(F.message) : '';
    f = `<div>${label}</div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><small class="muted">${pct.toFixed(0)}%${eta}${note}. Pode deixar esta janela aberta; o download continua se a internet cair.</small>`;
  } else if (ph === 'checking') {
    f = `<div>${esc(F.message)}</div>`;
  } else if (ph === 'error' && S.iso_sha256) {
    showManual = true;
    f = '<div class="muted">O download automático da Microsoft não funcionou; usando a ISO escolhida abaixo.</div>';
  } else if (ph === 'error') {
    showManual = true;
    f = `<div class="err">✖ ${esc(F.message)}</div>
      <p class="muted" style="margin:8px 0 0">Você pode tentar de novo mais tarde ou usar uma ISO do Windows 11${lang} que já tenha baixado
      (em <b>microsoft.com/software-download/windows11</b>, “Baixar imagem de disco (ISO)”): escolha abaixo.</p>
      <div class="row"><button class="btn" id="retry">Tentar de novo</button></div>`;
  }
  const busyFetch = ['config','connecting','downloading','hashing','checking'].includes(ph) && !(S.win && S.win.config_error);
  if (busyFetch && !showManual) f += `<div class="row"><button class="btn" id="haveIso">Já tenho a ISO do Windows 11</button></div>`;
  $('#fetch').innerHTML = f;
  const rb = document.getElementById('retry'); if (rb) rb.onclick = async () => { try { await api('fetch', {}); } catch (e) { alert(e.message); } poll(); };
  const hb = document.getElementById('haveIso'); if (hb) hb.onclick = () => { showManual = true; render(); };
  $('#manual').style.display = showManual ? '' : 'none';
  if (showManual) $('#isoPath').placeholder = '…ou cole o caminho completo do arquivo .iso do Windows 11';
}

async function checkVentoy(id, key){
  if(VT[id]!==undefined) return;
  try { const r = await api('ventoy?disk='+encodeURIComponent(id)+'&key='+encodeURIComponent(key||'')); VT[id] = r.ventoy || null; }
  catch(e){ VT[id] = null; }
  render();
}
async function selectIso(p){ try{ await api('select',{path:p}); }catch(e){ alert(e.message); } poll(); }
async function poll(){ try{ S = await api('state'); render(); }catch(e){} }
$('#useIso').onclick = () => { const p=$('#isoPath').value.trim().replace(/^"|"$/g,''); if(p) selectIso(p); };
$('#refresh').onclick = () => { VT = {}; $('#confirmBox').dataset.sig=''; poll(); };
$('#quit').onclick = async () => { try{ await api('quit',{}); document.body.innerHTML='<main><h1>isoBuilder encerrado.</h1><p class="sub">Você já pode fechar esta aba.</p></main>'; }catch(e){ alert(e.message); } };
poll(); setInterval(()=>{ if(!document.hidden) poll(); }, 1500);
</script>
