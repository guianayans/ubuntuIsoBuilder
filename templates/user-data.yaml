#cloud-config
# Template base do Autoinstall (Subiquity) entregue via cloud-init NoCloud.
# Os marcadores no formato $${NOME} são substituídos por scripts/lib/uab.py (valores
# serializados como strings YAML seguras). As seções network, storage e
# ssh.authorized-keys são preenchidas programaticamente.
# Referência: https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
autoinstall:
  version: 1
  # Nenhuma pergunta na tela: instalação 100% desassistida.
  interactive-sections: []
  refresh-installer:
    update: false
  locale: ${LOCALE}
  keyboard:
    layout: ${KEYBOARD_LAYOUT}
    variant: ${KEYBOARD_VARIANT}
  timezone: ${TIMEZONE}
  identity:
    hostname: ${HOSTNAME}
    username: ${ADMIN_USER}
    realname: ${ADMIN_REALNAME}
    password: ${PASSWORD_HASH}
  ssh:
    install-server: true
    # Senha permanece aceita apenas até o provisionador (uab-provision)
    # confirmar a chave pública e aplicar PasswordAuthentication no.
    allow-pw: true
    authorized-keys: []
  apt:
    # Sem internet durante a instalação, instala a partir da ISO em vez de abortar.
    fallback: offline-install
    # O instalador roda "apt-get update" no fim sem nova tentativa: uma falha
    # momentânea do espelho derrubaria a instalação. O apt passa a tentar de novo.
    # (grava /etc/apt/apt.conf.d/94curtin-config, que sobrevive a essa etapa)
    conf: |
      Acquire::Retries "10";
      Acquire::http::Timeout "30";
      Acquire::https::Timeout "30";
  updates: security
  # Meta-pacote do kernel: garante que linux-modules-extra (onde ficam r8169 e a maioria dos
  # drivers de rede/hardware) e os headers ACOMPANHEM todo kernel — inclusive o kernel novo que
  # o "updates: security" instala durante a própria instalação. Sem isso, um upgrade de kernel
  # pode deixar a máquina sem placa de rede no primeiro boot.
  packages:
    - linux-generic
  network: {}
  storage: {}
  early-commands:
    # Verifica o disco de destino ANTES de qualquer escrita. Aborta se ambíguo.
    - sh /cdrom/uab/preflight.sh
    # Sem pendrive: avisa o painel que a instalação começou e sobe o heartbeat de progresso
    # (mostra "instalando" no card mesmo com a tela da máquina sem vídeo). Best-effort.
    - sh /cdrom/uab/uab-progress.sh begin
  late-commands:
    # Instala o provisionador de primeiro boot, ferramentas e o marcador anti-reinstalação.
    - sh /cdrom/uab/late-install.sh
    # Sem pendrive: encerra o heartbeat e avisa que vai reiniciar. Best-effort.
    - sh /cdrom/uab/uab-progress.sh end
  error-commands:
    # Mostra o motivo da falha no console para quem estiver na frente da máquina.
    - sh /cdrom/uab/on-error.sh
    # Sem pendrive: avisa o painel que a instalação falhou (card sai de "instalando"). Best-effort.
    - sh /cdrom/uab/uab-progress.sh fail
  shutdown: reboot
