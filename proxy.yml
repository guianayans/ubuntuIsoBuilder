# Traefik (Coolify) — copie para /data/coolify/proxy/dynamic/IsoBuilder.yaml
http:
  routers:
    iso-builder:
      rule: 'Host(`iso.gvtserver.online`) || Host(`www.iso.gvtserver.online`)'
      entryPoints:
        - https
      service: iso-builder-svc
      middlewares:
        - iso-builder-sec
      tls: {  }
  middlewares:
    iso-builder-sec:
      headers:
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-Frame-Options: DENY
          Cross-Origin-Resource-Policy: same-site
          Permissions-Policy: 'camera=(), microphone=(), geolocation=()'
          X-Robots-Tag: 'noindex, nofollow'
  services:
    iso-builder-svc:
      loadBalancer:
        servers:
          -
            url: 'http://iso-builder:8080'
