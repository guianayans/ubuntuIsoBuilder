<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ISO Builder · Ubuntu Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e95420'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="/static/pwa/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ISO Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/static/pwa/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top hidden" id="top">
  <div class="in">
    <a class="brand" href="#/"><span class="logo">◎</span><span class="brand-name">ISO Builder</span></a>
    <nav id="nav"></nav>
    <div class="who"><a class="btn sm icon hidden tsec-btn" id="tsecBtn" target="_blank" rel="noopener noreferrer" title="TerminalSec" aria-label="TerminalSec"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 5 3.4 9.1 8 10.5 4.6-1.4 8-5.5 8-10.5v-6l-8-3z"/><path d="M8.5 9.5 11 12l-2.5 2.5"/><path d="M12.5 15h3"/></svg></a><a class="btn sm icon hidden" id="remoteBtn" target="_blank" rel="noopener noreferrer" title="Acesso remoto (abre em nova aba)" aria-label="Acesso remoto"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="rlabel">Remoto</span></a><button class="btn sm hidden" id="installBtn" type="button">Instalar app</button><a class="who-about" href="/sobre" title="Página inicial pública do isoBuilder">Sobre</a><span class="email" id="whoEmail"></span><button class="btn sm" id="logout">Sair</button></div>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mnav"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="mnav hidden" id="mnav"></div>
</header>
<div class="mnav-bg hidden" id="mnavBg"></div>
<!-- TerminalSec dentro do ISO Builder: overlay com vidro fosco (o iframe é criado só na 1ª abertura) -->
<div class="tsec-ov hidden" id="tsecOv" role="dialog" aria-modal="true" aria-labelledby="tsecOvTitle">
  <div class="tsec-ov-panel">
    <div class="tsec-ov-bar">
      <span class="tsec-ov-title" id="tsecOvTitle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 5 3.4 9.1 8 10.5 4.6-1.4 8-5.5 8-10.5v-6l-8-3z"/><path d="M8.5 9.5 11 12l-2.5 2.5"/><path d="M12.5 15h3"/></svg> TerminalSec <span class="tsec-ov-dot" id="tsecOvDot"></span></span>
      <a class="btn sm" id="tsecOvNew" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg> Abrir em nova aba</a>
      <button class="btn sm icon tsec-ov-close" id="tsecOvClose" type="button" aria-label="Fechar" title="Fechar (Esc)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="tsec-ov-body" id="tsecOvBody">
      <div class="tsec-ov-msg" id="tsecOvMsg">Carregando o TerminalSec…<br><span class="muted small">Se ficar em branco (ex.: login da Cloudflare), use “Abrir em nova aba”, entre, e volte aqui.</span></div>
    </div>
  </div>
</div>
<div id="jobs" class="jobs hidden" role="status" aria-live="polite"></div>
<main id="view"></main>
<script src="/static/pkgicons.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
